name: Recover and inspect desktop v1.0.3 source

on:
  push:
    branches: [feat/atlas-v1.1-map-workspace]
    paths: ['.github/workflows/recover-desktop-source.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original published Windows package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.3 -R "$GITHUB_REPOSITORY" -p "Arazi-Atlasi-1.0.3-Windows-x64.zip" -D _download
      - name: Unpack Electron source and identify architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _unpacked desktop-source
          python3 - <<'PY'
          import json,zipfile, pathlib
          source=pathlib.Path('_download/Arazi-Atlasi-1.0.3-Windows-x64.zip')
          with zipfile.ZipFile(source) as z:
              names=z.namelist()
              manifest={'archive_name':source.name,'file_count':len(names),'first_80_files':names[:80],
                        'asar_files':[n for n in names if n.endswith('.asar')],
                        'zip_size':source.stat().st_size}
              pathlib.Path('desktop-source/package-inspection.json').write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
              for n in names:
                  if n.endswith('app.asar'):
                      p=pathlib.Path('_unpacked')/pathlib.Path(n).name
                      p.write_bytes(z.read(n))
          print(json.dumps(manifest,ensure_ascii=False)[:5000])
          PY
          if test -f _unpacked/app.asar; then
            npx --yes @electron/asar extract _unpacked/app.asar _unpacked/app
            python3 - <<'PY'
          import pathlib,shutil,json
          src=pathlib.Path('_unpacked/app')
          out=pathlib.Path('desktop-source/app')
          out.mkdir(parents=True,exist_ok=True)
          items=[]
          for f in src.rglob('*'):
              if not f.is_file():continue
              rel=f.relative_to(src)
              if 'node_modules' in rel.parts or '.git' in rel.parts:continue
              if len(rel.parts)>5 or f.stat().st_size>800_000:continue
              if f.suffix.lower() not in ('.js','.mjs','.cjs','.html','.htm','.css','.json','.md','.txt','.svg'):continue
              dst=out/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(f,dst)
              items.append({'path':str(rel),'bytes':f.stat().st_size})
          pathlib.Path('desktop-source/extracted-files.json').write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Extracted useful text files:',len(items))
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-source
          if ! git diff --cached --quiet; then
            git commit -m "chore: recover published v1.0.3 Electron source for safe improvements"
            git push
          fi
